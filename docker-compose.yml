version: '3.8'

services:
  db:
    platform: linux/amd64  # Явно указываем платформу
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - project_app-network
    working_dir: /app
    command: ["sh", "-c", "go build -o app ./cmd/main.go && ./app"]
    environment:
      DB_HOST: db  # Важно: должно совпадать с именем сервиса
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}

volumes:
  postgres_data:

networks:
  project_app-network:
    driver: bridge